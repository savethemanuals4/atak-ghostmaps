name: Refresh GhostMaps index
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git clone --depth 1 https://github.com/s2underground/GhostMaps.git /tmp/GhostMaps
      - run: python3 build_index.py --local /tmp/GhostMaps
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.kml
          git diff --cached --quiet || git commit -m "Update index.kml to latest GhostMaps exports"
          git push
